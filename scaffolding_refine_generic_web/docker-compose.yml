version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: portal-postgres
    environment:
      POSTGRES_DB: portal_admin
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal1234
    ports:
      - "55433:5432"
    volumes:
      - portal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portal_pg_data:
