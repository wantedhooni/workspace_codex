services:
  vault:
    image: hashicorp/vault:1.21
    container_name: scaffolding-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=dev-root-token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:17
    container_name: scaffolding-user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userapp
      POSTGRES_PASSWORD: userapp
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userapp -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:17
    container_name: scaffolding-order-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderapp
      POSTGRES_PASSWORD: orderapp
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderapp -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: discovery-service
        APP_PORT: 8761
    image: scaffolding/discovery-service:local
    container_name: scaffolding-discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: config-server
        APP_PORT: 8888
    image: scaffolding/config-server:local
    container_name: scaffolding-config-server
    depends_on:
      discovery-service:
        condition: service_healthy
      vault:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      VAULT_HOST: vault
      VAULT_PORT: 8200
      CONFIG_SERVER_VAULT_TOKEN: dev-root-token
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: api-gateway
        APP_PORT: 8000
    image: scaffolding/api-gateway:local
    container_name: scaffolding-api-gateway
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: auth-server
        APP_PORT: 9000
    image: scaffolding/auth-server:local
    container_name: scaffolding-auth-server
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: user-service
        APP_PORT: 8081
    image: scaffolding/user-service:local
    container_name: scaffolding-user-service
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888/config
      USER_DB_HOST: user-db
      USER_DB_PORT: 5432
      USER_DB_NAME: userdb
      USER_DB_USERNAME: userapp
      USER_DB_PASSWORD: userapp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: order-service
        APP_PORT: 8082
    image: scaffolding/order-service:local
    container_name: scaffolding-order-service
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      order-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888/config
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: orderdb
      ORDER_DB_USERNAME: orderapp
      ORDER_DB_PASSWORD: orderapp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  user-db-data:
  order-db-data:
