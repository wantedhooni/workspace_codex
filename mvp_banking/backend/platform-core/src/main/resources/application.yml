spring:
  application:
    name: mvp-banking-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mvp_banking}
    username: ${DB_USERNAME:mvp_admin}
    password: ${DB_PASSWORD:mvp_admin}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      issuer: mvp-banking
      secret: ${JWT_SECRET:local-development-jwt-secret-change-this-immediately}
      access-token-expiration-seconds: 1800
      refresh-token-expiration-seconds: 1209600
