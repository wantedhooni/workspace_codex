server:
  port: 8080

spring:
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: tradeautoScheduler
            instanceId: AUTO
          jobStore:
            isClustered: true
            clusterCheckinInterval: 15000
            tablePrefix: QRTZ_
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          threadPool:
            threadCount: 5
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradeauto}
    username: ${DB_USER:tradeauto}
    password: ${DB_PASSWORD:tradeauto}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  polygon:
    apiKey: ${POLYGON_API_KEY:}
  admin:
    user: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin1234}
    jwtSecret: ${ADMIN_JWT_SECRET:change-me-change-me-change-me-32}
    jwtExpirationMs: ${ADMIN_JWT_EXP_MS:86400000}
  scheduling:
    zone: America/New_York
    dailyCron: "0 20 18 * * *" # 6:20 PM ET
