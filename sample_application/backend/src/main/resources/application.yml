spring:
  datasource:
    url: jdbc:h2:mem:securities;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: change-this-to-a-long-random-secret-key-for-prod
      expiration-seconds: 3600
