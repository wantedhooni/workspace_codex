spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  quartz:
    auto-startup: false

security:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-123456
    expiration-seconds: 3600

app:
  ai:
    stock-recommendation:
      enabled: true
      provider: stub
      model-name: stub-local-model
      max-recommendations: 5
