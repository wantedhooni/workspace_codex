spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/derivatives_mvp}
    username: ${DB_USERNAME:derivops}
    password: ${DB_PASSWORD:derivops}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  quartz:
    job-store-type: memory
    auto-startup: true
    properties:
      org.quartz.scheduler.instanceName: DerivOpsQuartz
      org.quartz.threadPool.threadCount: 3
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          temperature: ${OLLAMA_CHAT_TEMPERATURE:0.2}
          format: json

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret-123456}
    expiration-seconds: 3600

logging:
  level:
    org.springframework.security: INFO
    com.derivops.mvp: INFO

app:
  audit:
    r2dbc:
      url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/derivatives_mvp}
      username: ${R2DBC_USERNAME:${DB_USERNAME:derivops}}
      password: ${R2DBC_PASSWORD:${DB_PASSWORD:derivops}}
  ai:
    stock-recommendation:
      enabled: ${AI_STOCK_RECOMMENDATION_ENABLED:true}
      provider: ${AI_STOCK_RECOMMENDATION_PROVIDER:ollama}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1}
      max-recommendations: 5
      disclaimer: ${AI_STOCK_RECOMMENDATION_DISCLAIMER:AI 추천 결과는 운영 보조용 초안이며 투자 자문이 아닙니다. 실제 주문 전 시장 데이터, 승인 정책, 리스크 한도를 별도로 확인해야 합니다.}
