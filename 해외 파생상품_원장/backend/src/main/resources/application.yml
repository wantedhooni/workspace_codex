spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/derivatives_mvp}
    username: ${DB_USERNAME:derivops}
    password: ${DB_PASSWORD:derivops}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret-123456}
    expiration-seconds: 3600

logging:
  level:
    org.springframework.security: INFO
    com.derivops.mvp: INFO
