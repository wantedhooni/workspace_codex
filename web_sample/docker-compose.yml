services:
  user-postgres:
    image: postgres:16-alpine
    container_name: web-sample-user-postgres
    environment:
      POSTGRES_DB: user_sample
      POSTGRES_USER: user_sample
      POSTGRES_PASSWORD: user_sample_pw
    ports:
      - "55432:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_sample -d user_sample"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-postgres:
    image: postgres:16-alpine
    container_name: web-sample-admin-postgres
    environment:
      POSTGRES_DB: admin_sample
      POSTGRES_USER: admin_sample
      POSTGRES_PASSWORD: admin_sample_pw
    ports:
      - "5433:5432"
    volumes:
      - admin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_sample -d admin_sample"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: web-sample-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  user-postgres-data:
  admin-postgres-data:
  redis-data:
