server:
  port: 8761

spring:
  application:
    name: discovery-server
  profiles:
    default: local

eureka:
  client:
    instance:
      prefer-ip-address: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761/eureka/}


