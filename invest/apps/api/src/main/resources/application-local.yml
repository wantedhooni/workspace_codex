spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/app
    username: app
    password: app
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect

app:
  security:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin1234}
    user-username: ${APP_USER_USERNAME:demo}
    user-password: ${APP_USER_PASSWORD:demo1234}
  market-data:
    stooq-enabled: ${APP_STOOQ_ENABLED:true}
