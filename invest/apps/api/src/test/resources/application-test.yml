spring:
  datasource:
    url: jdbc:h2:mem:quantportal;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

app:
  security:
    admin-username: admin
    admin-password: admin1234
    user-username: user
    user-password: user1234
  market-data:
    stooq-enabled: false
