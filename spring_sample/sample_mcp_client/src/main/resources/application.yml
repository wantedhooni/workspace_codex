spring:
  application:
    name: sample-mcp-client
  ai:
    mcp:
      client:
        enabled: true
        type: sync
        name: ops-mcp-client
        sse:
          connections:
            ops-server:
              url: http://localhost:8090

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
