services:
  postgres:
    image: postgres:16-alpine
    container_name: sample-r2dbc-postgres
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
