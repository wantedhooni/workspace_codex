server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: sample-cqrs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:sample_cqrs}
    username: ${DB_USERNAME:sample_user}
    password: ${DB_PASSWORD:sample_pass}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
