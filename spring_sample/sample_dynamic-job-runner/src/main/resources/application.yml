spring:
  application:
    name: dynamic-job-runner
  datasource:
    url: jdbc:h2:mem:dynamicjob;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: DynamicJobRunnerScheduler
      org.quartz.threadPool.threadCount: 5
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.example.dynamicjob: INFO
