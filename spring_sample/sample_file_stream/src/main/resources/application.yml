spring:
  application:
    name: sample-file-stream
  datasource:
    url: jdbc:h2:file:./data/sample-file-stream;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  storage:
    default-type: LOCAL
    local:
      base-path: ./storage/files
    s3:
      enabled: false
      bucket: sample-file-stream
      region: ap-northeast-2
      endpoint: ''
      path-style-access: true
