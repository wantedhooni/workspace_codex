spring:
  application:
    name: sample-batch
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sample_batch}
    username: ${APP_DATASOURCE_USERNAME:sample_batch}
    password: ${APP_DATASOURCE_PASSWORD:sample_batch}
    hikari:
      maximum-pool-size: ${APP_DATASOURCE_POOL_SIZE:20}
      minimum-idle: 5
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: sampleBatchScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 8
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.useProperties: false
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,quartz

app:
  trade-settlement:
    cron: ${APP_TRADE_SETTLEMENT_CRON:0 0/1 * * * ?}
    chunk-size: ${APP_TRADE_SETTLEMENT_CHUNK_SIZE:1000}
    page-size: ${APP_TRADE_SETTLEMENT_PAGE_SIZE:1000}
    default-seed-batch-size: ${APP_TRADE_SETTLEMENT_DEFAULT_SEED_BATCH_SIZE:5000}
