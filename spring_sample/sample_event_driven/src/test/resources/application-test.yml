spring:
  datasource:
    url: jdbc:h2:mem:eventdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    listener:
      auto-startup: false

app:
  kafka:
    enabled: false
  outbox:
    scheduler-enabled: false
    fixed-delay: 60000
  events:
    orders-topic: orders.created
    payments-topic: payments.result
    publish-batch-size: 50
