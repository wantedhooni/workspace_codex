services:
  postgres:
    image: postgres:16
    container_name: sample-saga-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: sample_saga
      POSTGRES_USER: sample_user
      POSTGRES_PASSWORD: sample_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample_user -d sample_saga"]
      interval: 10s
      timeout: 5s
      retries: 5
