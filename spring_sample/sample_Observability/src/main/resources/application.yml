server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: sample-observability
  datasource:
    url: jdbc:h2:file:./runtime/data/observability;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        sample.order.processing.time: true

app:
  security:
    jwt:
      issuer: sample-observability
      secret: sample-observability-demo-secret-key-2026-for-jwt-signing
      expiration-minutes: 480
