services:
  postgres:
    image: postgres:16-alpine
    container_name: sample-r2dbc-auditlog-postgres
    environment:
      POSTGRES_DB: auditdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auditdb"]
      interval: 10s
      timeout: 5s
      retries: 5
