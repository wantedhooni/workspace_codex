apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: commerce-gateway
  namespace: commerce
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - commerce.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: commerce-entrypoint
  namespace: commerce
spec:
  hosts:
    - commerce.local
  gateways:
    - commerce-gateway
  http:
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: api-gateway.commerce.svc.cluster.local
            port:
              number: 8080
            subset: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: commerce
spec:
  host: api-gateway.commerce.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: product-service
  namespace: commerce
spec:
  host: product-service.commerce.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: inventory-service
  namespace: commerce
spec:
  host: inventory-service.commerce.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service
  namespace: commerce
spec:
  host: payment-service.commerce.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-service
  namespace: commerce
spec:
  host: order-service.commerce.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: commerce-mtls
  namespace: commerce
spec:
  mtls:
    mode: STRICT

