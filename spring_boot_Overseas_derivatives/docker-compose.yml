services:
  postgres:
    image: postgres:16
    container_name: derivatives-mvp-postgres
    environment:
      POSTGRES_DB: derivatives_mvp
      POSTGRES_USER: derivops
      POSTGRES_PASSWORD: derivops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
