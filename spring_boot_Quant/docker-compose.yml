services:
  mariadb:
    image: mariadb:11.4
    container_name: quant-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: quant
      MARIADB_USER: quant
      MARIADB_PASSWORD: quant1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4.8.1
    container_name: quant-adminer
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "18080:8080"

volumes:
  mariadb-data:
