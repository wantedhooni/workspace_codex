spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/local
  datasource:
    url: jdbc:h2:mem:quant;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  security:
    jwt:
      issuer: quant-backend-mvp-test
      secret: test-jwt-secret-key-for-integration-tests-2026
      expiration-seconds: 3600
