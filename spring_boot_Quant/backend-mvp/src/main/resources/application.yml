server:
  port: 8088

spring:
  application:
    name: quant-backend-mvp
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/quant}
    username: ${SPRING_DATASOURCE_USERNAME:quant}
    password: ${SPRING_DATASOURCE_PASSWORD:quant1234}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:quant-backend-mvp}
      secret: ${APP_JWT_SECRET:quant-local-demo-secret-key-change-me-please-2026}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:43200}
