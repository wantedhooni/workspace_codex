services:
  postgres:
    image: postgres:16-alpine
    container_name: market-signal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_signal}
      POSTGRES_USER: ${POSTGRES_USER:-market_signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_signal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_signal} -d ${POSTGRES_DB:-market_signal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: market-signal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: market-signal-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/market_signal}
      DB_USERNAME: ${DB_USERNAME:-market_signal}
      DB_PASSWORD: ${DB_PASSWORD:-market_signal}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-market-signal-platform-secret-key-should-be-32chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000}
      SEED_DATA_ENABLED: ${SEED_DATA_ENABLED:-true}
      SEED_REPLACE_MARKET_DATA: ${SEED_REPLACE_MARKET_DATA:-true}
      REPORT_BATCH_CRON: ${REPORT_BATCH_CRON:-0 0 8 ? * MON-FRI}
      REPORT_BATCH_ZONE: ${REPORT_BATCH_ZONE:-Asia/Seoul}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18080/api}
    container_name: market-signal-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18080/api}
    ports:
      - "${FRONTEND_HOST_PORT:-13000}:3000"

volumes:
  postgres_data:
  redis_data:
