services:
  postgres:
    image: postgres:16
    container_name: scaffolding-postgres
    environment:
      POSTGRES_USER: scaffolding
      POSTGRES_PASSWORD: scaffolding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaffolding"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
