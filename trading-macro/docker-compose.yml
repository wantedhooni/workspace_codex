services:
  db:
    image: postgres:16
    container_name: trading-macro-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: trading_macro
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    image: gradle:8.7-jdk21
    container_name: trading-macro-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["gradle", "bootRun"]
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_macro
      SPRING_DATASOURCE_USERNAME: trading
      SPRING_DATASOURCE_PASSWORD: trading
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - db
  frontend:
    image: node:20
    container_name: trading-macro-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["bash", "-lc", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
volumes:
  pgdata:
