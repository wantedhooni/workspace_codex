server:
  port: 9001

spring:
  application:
    name: service-auth
  datasource:
    url: ${DB_URL:jdbc:h2:mem:service-auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-should-be-longer-than-32-bytes}
    issuer: commerce-platform
    ttl-seconds: 7200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
