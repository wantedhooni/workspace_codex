x-application-runtime: &application-runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

x-application-healthcheck: &application-healthcheck
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-commerce-local}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-commerce-local}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.0@sha256:b0e5dbced1775de4d629f103c0a9cfc057decc62ce8d3cb1c54f8849a6c6eb62}
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --metrics-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./deploy/k8s/auth/commerce-realm.json:/opt/keycloak/data/import/commerce-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  user-service:
    <<: *application-runtime
    image: commerce/user-service:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
        APP_PORT: "8081"
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        BUILD_IMAGE: ${DOCKER_BUILD_IMAGE:-eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76}
        RUNTIME_IMAGE: ${DOCKER_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine@sha256:3f08b13888f595cc49edabea7250ba69499ba25602b267da591720769400e08c}
    environment:
      DB_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-commerce}
      DB_USERNAME: ${POSTGRES_USER:-commerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-commerce-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-commerce-local}
      OAUTH2_ENABLED: "true"
      OAUTH2_RESOURCE_CLIENT_ID: commerce-api
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8090/realms/commerce}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      COMMERCE_OBSERVABILITY_METRICS_ENVIRONMENT: local
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/readiness"]

  account-service:
    <<: *application-runtime
    image: commerce/account-service:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: account-service
        APP_PORT: "8082"
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        BUILD_IMAGE: ${DOCKER_BUILD_IMAGE:-eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76}
        RUNTIME_IMAGE: ${DOCKER_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine@sha256:3f08b13888f595cc49edabea7250ba69499ba25602b267da591720769400e08c}
    environment:
      DB_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-commerce}
      DB_USERNAME: ${POSTGRES_USER:-commerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-commerce-local}
      OAUTH2_ENABLED: "true"
      OAUTH2_RESOURCE_CLIENT_ID: commerce-api
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8090/realms/commerce}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      COMMERCE_OBSERVABILITY_METRICS_ENVIRONMENT: local
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health/readiness"]

  contents-service:
    <<: *application-runtime
    image: commerce/contents-service:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: contents-service
        APP_PORT: "8083"
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        BUILD_IMAGE: ${DOCKER_BUILD_IMAGE:-eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76}
        RUNTIME_IMAGE: ${DOCKER_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine@sha256:3f08b13888f595cc49edabea7250ba69499ba25602b267da591720769400e08c}
    environment:
      DB_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-commerce}
      DB_USERNAME: ${POSTGRES_USER:-commerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-commerce-local}
      OAUTH2_ENABLED: "true"
      OAUTH2_RESOURCE_CLIENT_ID: commerce-api
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8090/realms/commerce}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      COMMERCE_OBSERVABILITY_METRICS_ENVIRONMENT: local
    ports:
      - "${CONTENTS_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health/readiness"]

  api-gateway:
    <<: *application-runtime
    image: commerce/api-gateway:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
        APP_PORT: "8080"
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        BUILD_IMAGE: ${DOCKER_BUILD_IMAGE:-eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76}
        RUNTIME_IMAGE: ${DOCKER_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine@sha256:3f08b13888f595cc49edabea7250ba69499ba25602b267da591720769400e08c}
    environment:
      USER_SERVICE_URI: http://user-service:8081
      ACCOUNT_SERVICE_URI: http://account-service:8082
      CONTENTS_SERVICE_URI: http://contents-service:8083
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-commerce-local}
      OAUTH2_ENABLED: "true"
      OAUTH2_CLIENT_ENABLED: "true"
      OAUTH2_RESOURCE_CLIENT_ID: commerce-api
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8090/realms/commerce}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: ${OAUTH2_GATEWAY_CLIENT_ID:-commerce-gateway}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: ${OAUTH2_GATEWAY_CLIENT_SECRET:-commerce-gateway-local-secret}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI: "{baseUrl}/login/oauth2/code/{registrationId}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8090/realms/commerce}/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE: preferred_username
      COMMERCE_OBSERVABILITY_METRICS_ENVIRONMENT: local
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      contents-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]

volumes:
  postgresql-data:
  redis-data:
  keycloak-data:
