apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yml: |
    multitenancy_enabled: false
    target: all
    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /var/mimir/common
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /var/mimir/blocks
      bucket_store:
        sync_dir: /var/mimir/tsdb-sync
      tsdb:
        dir: /var/mimir/tsdb
    compactor:
      data_dir: /var/mimir/compactor
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /var/mimir/rules
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: grafana/mimir:2.17.1
          args: ["-config.file=/etc/mimir/mimir.yml"]
          ports:
            - name: http
              containerPort: 9009
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: data
              mountPath: /var/mimir
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http

