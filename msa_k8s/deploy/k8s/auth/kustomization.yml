apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keycloak.yml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: commerce-keycloak-realm
    namespace: commerce
    files:
      - commerce-realm.json=commerce-realm.json
secretGenerator:
  - name: commerce-keycloak-credentials
    namespace: commerce
    literals:
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin-local
      - OAUTH2_GATEWAY_CLIENT_SECRET=commerce-gateway-local-secret
