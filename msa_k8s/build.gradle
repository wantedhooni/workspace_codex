plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    springBootVersion = '3.5.16'
    springCloudVersion = '2025.0.3'
    applicationModuleNames = [
            'api-gateway',
            'user-service',
            'account-service',
            'contents-service'
    ]
    moduleVersions = [
            'api-gateway': providers.gradleProperty('apiGatewayVersion').get(),
            'user-service': providers.gradleProperty('userServiceVersion').get(),
            'account-service': providers.gradleProperty('accountServiceVersion').get(),
            'contents-service': providers.gradleProperty('contentsServiceVersion').get(),
            'common-metrics': providers.gradleProperty('commonMetricsVersion').get(),
            'common-security': providers.gradleProperty('commonSecurityVersion').get()
    ]
}

allprojects {
    group = 'com.example.commerce'

    repositories {
        mavenCentral()
    }
}

subprojects {
    version = rootProject.ext.moduleVersions[project.name]

    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    if (rootProject.ext.applicationModuleNames.contains(project.name)) {
        apply from: rootProject.file('gradle/docker.gradle')
    }
}

tasks.register('printVersions') {
    group = 'versioning'
    description = '모든 모듈의 현재 버전을 출력한다.'
    doLast {
        subprojects.each { module ->
            println "${module.name}=${module.version}"
        }
    }
}

tasks.register('printImageCoordinatesAll') {
    group = 'container'
    description = '선택한 환경의 모든 실행 모듈 이미지 좌표를 출력한다.'
    dependsOn rootProject.ext.applicationModuleNames.collect {
        "${project(":${it}").path}:printImageCoordinate"
    }
}

tasks.register('dockerBuildAll') {
    group = 'container'
    description = '선택한 환경의 모든 실행 모듈 이미지를 로컬 Docker daemon에 적재한다.'
    dependsOn rootProject.ext.applicationModuleNames.collect { ":${it}:dockerBuild" }
}

tasks.register('dockerPushAll') {
    group = 'container'
    description = '선택한 환경의 모든 실행 모듈 이미지를 Registry로 직접 전송한다.'
    dependsOn rootProject.ext.applicationModuleNames.collect { ":${it}:dockerPush" }
}
